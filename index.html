<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cricket Clash — 3D Browser Fighting Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Rajdhani:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080c14;
      font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }
    .interactive {
      pointer-events: auto;
    }
    /* Orientation Warning for mobile */
    #rotate-device-prompt {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 12, 20, 0.96);
      z-index: 99999;
      color: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    @media screen and (orientation: portrait) and (max-width: 900px) {
      #rotate-device-prompt {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer"></div>
    <div id="rotate-device-prompt">
      <div style="font-size: 3rem; margin-bottom: 1rem;"><i class="fa-solid fa-mobile-screen-button" style="color:#ffcc00;"></i> <i class="fa-solid fa-rotate" style="color:#ffcc00;"></i></div>
      <h2 style="font-family: 'Teko', sans-serif; font-size: 2.2rem; letter-spacing: 2px; color: #ffcc00;">PLEASE ROTATE YOUR DEVICE</h2>
      <p style="color: #94a3b8; font-size: 1.1rem; margin-top: 8px;">Cricket Clash is designed for landscape combat.</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
